<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="TOT (Travel of Traveler) — 속초·고성·양양을 3D로 미리 소유하는 관광 특화 웹앱" />
    <title>TOT — Travel of Traveler</title>
    <script>
      // 번들 평가/실행 중 발생한 오류를 흰 화면/무한 로딩 대신 화면에 표시한다.
      (function () {
        function showBootError(msg) {
          var s = document.getElementById('boot-splash');
          if (!s) return;
          s.innerHTML =
            '<div style="max-width:90%;text-align:center;color:#f87171;font-family:system-ui,sans-serif;">' +
            '<div style="font-size:20px;font-weight:700;margin-bottom:8px;">TOT 로딩 오류</div>' +
            '<pre style="white-space:pre-wrap;word-break:break-all;font-size:12px;text-align:start;">' +
            String(msg).replace(/[<>&]/g, '') +
            '</pre></div>';
        }
        window.addEventListener('error', function (e) {
          showBootError((e.message || 'Error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          showBootError('Promise: ' + (r && (r.stack || r.message) ? r.stack || r.message : r));
        });
        // 12초가 지나도 앱이 마운트되지 않으면(스플래시가 남아있으면) 안내 + 새로고침 버튼
        setTimeout(function () {
          var s = document.getElementById('boot-splash');
          var msg = document.getElementById('boot-splash-msg');
          if (s && msg) {
            msg.innerHTML =
              '로딩이 지연되고 있습니다. <a href="javascript:location.reload(true)" style="color:#2dd4bf;">새로고침</a>' +
              '<br/>계속 멈춰 있으면 F12 → Console 의 오류를 확인해 주세요.';
          }
        }, 12000);
      })();
    </script>
  </head>
  <body>
    <!-- 스플래시는 #root 밖(형제)에 두고, 마운트 후 main.tsx 가 직접 제거한다.
         (#root 자식으로 두면 일부 상황에서 제거되지 않아 무한 '로딩 중'이 됨) -->
    <div id="boot-splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0f172a;color:#f1f5f9;font-family:system-ui,sans-serif;">
      <div style="font-size:28px;font-weight:700;color:#2dd4bf;">TOT</div>
      <div id="boot-splash-msg" style="font-size:13px;color:#94a3b8;">Travel of Traveler — 로딩 중…</div>
      <noscript style="font-size:13px;color:#f87171;">이 앱을 보려면 JavaScript를 활성화하세요.</noscript>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
